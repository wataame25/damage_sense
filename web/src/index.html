<meta charset="utf-8">
<title>ダメージ感覚</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 対戦画面のように「攻撃側 → 技 → 防御側」を横一列に並べ、結果はHPバー上で見せる。スマホでは縦積み */
:root {
  --ground: #e9edf2;
  --surface: #ffffff;
  --surface-2: #f4f6f9;
  --ink: #17202b;
  --muted: #5b6676;
  --line: #d3dae3;
  --accent: #2c56d6;
  --accent-ink: #ffffff;
  --hp-good: #22a35f;
  --hp-warn: #e2a417;
  --hp-bad: #d8414a;
  --dmg: #d8414a;
  --dmg-soft: rgba(216, 65, 74, .28);
  --font-display: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", monospace;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0f141b;
    --surface: #18202a;
    --surface-2: #1f2834;
    --ink: #e6ebf2;
    --muted: #93a1b3;
    --line: #2b3644;
    --accent: #7d9cff;
    --accent-ink: #0f141b;
    --hp-good: #3cc47a;
    --hp-warn: #f0b93a;
    --hp-bad: #f0626a;
    --dmg: #f0626a;
    --dmg-soft: rgba(240, 98, 106, .3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0f141b;
  --surface: #18202a;
  --surface-2: #1f2834;
  --ink: #e6ebf2;
  --muted: #93a1b3;
  --line: #2b3644;
  --accent: #7d9cff;
  --accent-ink: #0f141b;
  --hp-good: #3cc47a;
  --hp-warn: #f0b93a;
  --hp-bad: #f0626a;
  --dmg: #f0626a;
  --dmg-soft: rgba(240, 98, 106, .3);
}

* { box-sizing: border-box; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  padding: 0 16px;
}
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 20px 48px; display: grid; gap: 16px; }
.stack { display: grid; gap: 16px; min-width: 0; }
/* グリッドの子要素が中身の幅で画面からはみ出さないようにする */
.wrap > *, .stack > *, .battle > *, .answer > *, .result > *, .summary > *, .calc > *, .calc-row > * { min-width: 0; }
.calc code { overflow-wrap: anywhere; }
.status span { overflow-wrap: anywhere; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- ヘッダー ---- */
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.brand { display: grid; gap: 2px; }
.brand h1 { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.1; margin: 0; letter-spacing: .04em; }
.brand p { margin: 0; color: var(--muted); font-size: 12px; }
.modes { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.modes button {
  border: 0; background: transparent; padding: 6px 16px; border-radius: 999px; cursor: pointer; font-size: 14px; color: var(--muted);
}
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

/* ---- 進行状況 ---- */
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 13px; color: var(--muted); }
.status strong { color: var(--ink); font-family: var(--font-data); font-weight: 500; }
.pips { display: flex; gap: 4px; }
.pip { width: 22px; height: 8px; border-radius: 2px; background: var(--line); }
.pip.done { background: var(--ink); }
.pip.now { background: var(--accent); }

/* ---- 対戦カード ---- */
.battle {
  display: grid; grid-template-columns: 1fr minmax(200px, 250px) 1fr; gap: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
}
.side { padding: 18px 20px; display: grid; gap: 10px; align-content: start; }
.side + .center, .center + .side { border-left: 1px solid var(--line); }
.role { font-size: 11px; letter-spacing: .14em; color: var(--muted); }
.mon-name { font-family: var(--font-display); font-size: 26px; line-height: 1.2; margin: 0; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.type {
  display: inline-block; font-size: 12px; padding: 1px 10px; border-radius: 4px; color: #fff; font-weight: 500;
  text-shadow: 0 1px 0 rgba(0,0,0,.25);
}
dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 14px; }
dl.facts dt { color: var(--muted); font-size: 12px; padding-top: 2px; }
dl.facts dd { margin: 0; }
.stat { display: grid; grid-template-columns: 4.5em auto 1fr; align-items: baseline; gap: 8px; }
.stat-val { font-family: var(--font-data); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat-note { font-size: 12px; color: var(--muted); }
.flag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); }
.flag.up { border-color: var(--accent); color: var(--accent); }
.flag.down { border-color: var(--hp-bad); color: var(--hp-bad); }
.flag.rank { font-family: var(--font-data); }
.spread { font-family: var(--font-data); font-size: 13px; font-variant-numeric: tabular-nums; }

.center { background: var(--surface-2); padding: 18px 16px; display: grid; gap: 14px; align-content: center; text-align: center; }
.move-name { font-family: var(--font-display); font-size: 24px; line-height: 1.2; margin: 0; }
.move-head { display: grid; gap: 10px; justify-items: center; }
.flag.stab { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 500; }
.stab-row { display: flex; }
.move-type { justify-content: center; }
.move-meta { font-size: 13px; color: var(--muted); display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 10px; }
.move-meta b { font-family: var(--font-data); color: var(--ink); font-weight: 500; }
.arrow { font-family: var(--font-display); color: var(--muted); font-size: 18px; letter-spacing: .3em; }
.env { display: grid; gap: 6px; font-size: 13px; }
.env div { display: flex; justify-content: space-between; gap: 8px; border-top: 1px dashed var(--line); padding-top: 6px; }
.env span:first-child { color: var(--muted); }
.env-note { margin: -2px 0 0; font-size: 11px; color: var(--muted); text-align: left; line-height: 1.5; }

/* ---- 回答 ---- */
.answer { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; display: grid; gap: 12px; }
.answer h2, .result h2 { font-size: 15px; margin: 0; font-weight: 700; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.choice {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface-2); cursor: pointer; text-align: left;
}
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice .key { font-family: var(--font-data); font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
.choice .range { font-family: var(--font-data); font-size: 18px; font-variant-numeric: tabular-nums; }
.choice.correct { border-color: var(--hp-good); box-shadow: inset 0 0 0 1px var(--hp-good); }
.choice.wrong { border-color: var(--hp-bad); box-shadow: inset 0 0 0 1px var(--hp-bad); }
.choice:disabled { cursor: default; }
.input-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.num { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 0 12px; }
.num input {
  width: 6.5em; border: 0; background: transparent; color: var(--ink); font-family: var(--font-data); font-size: 24px; padding: 8px 4px;
  font-variant-numeric: tabular-nums;
}
.num input:focus { outline: none; }
.num:focus-within { border-color: var(--accent); }
.num span { color: var(--muted); font-family: var(--font-data); font-size: 18px; }
.btn {
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 10px 20px;
  cursor: pointer; font-weight: 500;
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:disabled { opacity: .5; cursor: default; }

/* ---- 結果 ---- */
.result { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; display: grid; gap: 16px; }
.verdict { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.verdict .mark { font-family: var(--font-display); font-size: 28px; line-height: 1; }
.verdict .mark.ok { color: var(--hp-good); }
.verdict .mark.ng { color: var(--hp-bad); }
.verdict .sub { color: var(--muted); font-size: 14px; }
.verdict .sub b { font-family: var(--font-data); color: var(--ink); font-weight: 500; }

.hpbox { display: grid; gap: 6px; }
.hp-head { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); }
.hp-head b { font-family: var(--font-data); color: var(--ink); font-weight: 500; }
.hpbar { margin-top: 18px; position: relative; height: 22px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: visible; }
.hp-remain { position: absolute; inset: 0 auto 0 0; border-radius: 3px 0 0 3px; }
.hp-roll { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, var(--dmg-soft) 0 5px, transparent 5px 9px); border-left: 2px solid var(--dmg); border-right: 2px solid var(--dmg); }
.hp-guess { position: absolute; top: -6px; bottom: -6px; width: 0; border-left: 2px dashed var(--ink); }
.hp-guess span { position: absolute; top: -20px; left: 0; transform: translateX(-50%); font-size: 11px; font-family: var(--font-data); white-space: nowrap; background: var(--surface); padding: 0 4px; }
.hp-scale { position: relative; height: 16px; font-family: var(--font-data); font-size: 11px; color: var(--muted); }
.hp-scale span { position: absolute; transform: translateX(-50%); }
.hp-scale span:first-child { transform: none; }
.hp-scale span:last-child { transform: translateX(-100%); }
.hp-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); }
.sw { display: inline-block; width: 12px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }

.figures { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.fig { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; }
.fig span { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.fig b { font-family: var(--font-data); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }

details.breakdown { border-top: 1px solid var(--line); padding-top: 12px; }
details.breakdown summary { cursor: pointer; font-size: 14px; font-weight: 500; }
.calc { display: grid; gap: 6px; margin-top: 10px; font-size: 13px; }
.calc-row { display: grid; grid-template-columns: 7.5em 1fr; gap: 10px; }
.calc-row > span:first-child { color: var(--muted); }
.calc code { font-family: var(--font-data); font-size: 13px; }
.rolls { font-family: var(--font-data); font-size: 12px; color: var(--muted); overflow-x: auto; white-space: nowrap; }
.notes { margin: 0; padding-left: 1.2em; font-size: 13px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.kbd { font-size: 12px; color: var(--muted); align-self: center; }

/* ---- まとめ ---- */
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 20px; display: grid; gap: 16px; }
.summary h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; margin: 0; }
.big { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.big div { display: grid; }
.big span { font-size: 12px; color: var(--muted); }
.big b { font-family: var(--font-data); font-size: 32px; font-weight: 500; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 560px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
td.n { font-family: var(--font-data); font-variant-numeric: tabular-nums; text-align: right; }
th.n { text-align: right; }

.share { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.share h3 { margin: 0; font-size: 15px; }
.share-preview {
  margin: 0; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px;
  font-family: var(--font-body); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere;
}
a.btn { text-decoration: none; display: inline-flex; align-items: center; }
.big b.marks { font-family: var(--font-body); font-size: 24px; letter-spacing: .08em; }
footer { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
footer p { margin: 0; max-width: 72ch; }

/* ---- タイトル画面 ---- */
.brand h1 button { all: unset; cursor: pointer; }
.brand h1 button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.title { display: grid; gap: 16px; }
.hero {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 36px 24px 32px;
  display: grid; gap: 10px; justify-items: center; text-align: center;
  background-image: linear-gradient(90deg, var(--hp-good) 0 58%, var(--dmg-soft) 58% 74%, var(--surface-2) 74%);
  background-size: 100% 8px; background-repeat: no-repeat; background-position: bottom;
}
.hero-kicker { margin: 0; text-wrap: balance; font-size: 12px; letter-spacing: .14em; color: var(--muted); }
.hero-logo { margin: 0; font-family: var(--font-display); font-size: clamp(40px, 9vw, 64px); line-height: 1.1; letter-spacing: .06em; }
.hero-lead { margin: 0; color: var(--muted); max-width: 40em; text-wrap: balance; }
.mode-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.mode-card {
  display: grid; gap: 6px; align-content: start; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 18px 16px;
  transition: border-color .15s, transform .15s;
}
.mode-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.mc-name { font-family: var(--font-display); font-size: 24px; line-height: 1.2; }
.mc-how { font-size: 14px; }
.mc-goal, .mc-best { font-size: 12px; color: var(--muted); }
.mc-best { font-family: var(--font-data); }
.mc-go { margin-top: 6px; color: var(--accent); font-weight: 500; font-size: 14px; }
.guide { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; display: grid; gap: 10px; }
.guide h2 { margin: 0; font-size: 15px; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: step; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.steps li { counter-increment: step; display: grid; gap: 4px; align-content: start; background: var(--surface-2); border-radius: 8px; padding: 12px 14px; }
.steps li::before { content: counter(step); font-family: var(--font-data); font-size: 12px; color: var(--accent); }
.steps b { font-size: 15px; }
.steps span { font-size: 13px; color: var(--muted); }
.steps em { font-style: normal; color: var(--ink); font-weight: 500; }
.tips { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; font-size: 13px; }
@media (max-width: 760px) {
  .hero { padding: 24px 16px 22px; }
  .mode-cards, .steps { grid-template-columns: 1fr; }
  .mode-card { padding: 14px 16px; }
  .mc-name { font-size: 20px; }
  .guide { padding: 14px 16px; }
}

.ability-note { display: block; font-size: 12px; color: var(--muted); }
.calc-row .flag { margin-left: 6px; font-size: 11px; }
@media (max-width: 760px) {
  /* スマホ：技と天候を上の帯に、攻撃側と防御側を左右に並べて1画面に収める */
  .wrap { padding-block: 10px 32px; gap: 10px; }
  .brand h1 { font-size: 22px; }
  .brand p { font-size: 11px; }
  .modes button { padding: 5px 12px; font-size: 13px; }
  .status { font-size: 12px; gap: 4px 12px; }
  .pip { width: 14px; height: 6px; }
  .battle { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "move move" "atk dfn"; }
  .side.atk { grid-area: atk; }
  .side.dfn { grid-area: dfn; }
  .center { grid-area: move; }
  .side + .center, .center + .side { border-left: 0; }
  .side.dfn { border-left: 1px solid var(--line); }
  .center { border-bottom: 1px solid var(--line); padding: 10px 12px; gap: 6px; text-align: left; }
  .move-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .arrow { display: none; }
  .move-name { font-size: 20px; }
  .move-type { justify-content: flex-start; }
  .move-meta { justify-content: flex-start; font-size: 12px; }
  .env { font-size: 12px; gap: 3px; }
  .env div { padding-top: 3px; }
  .env-note { font-size: 10px; }
  .side { padding: 10px; gap: 6px; }
  .role { font-size: 10px; }
  .mon-name { font-size: 17px; }
  .type { font-size: 11px; padding: 0 7px; }
  dl.facts { grid-template-columns: auto minmax(0, 1fr); gap: 2px 6px; font-size: 12px; }
  dl.facts dt { font-size: 10px; padding-top: 1px; }
  dl.facts dd { overflow-wrap: anywhere; }
  .flag { font-size: 10px; padding: 0 5px; }
  .spread { font-size: 11px; }
  .stat { grid-template-columns: auto minmax(0, 1fr); gap: 0 6px; }
  .stat-val { font-size: 18px; }
  .stat > .stat-note:last-child { grid-column: 1 / -1; font-size: 10px; }
  .answer, .result { padding: 14px; }
  .figures { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .choices { grid-template-columns: 1fr; gap: 8px; }
  .choice { padding: 9px 12px; }
  .calc-row { grid-template-columns: 1fr; gap: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .reveal { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <h1><button type="button" id="home" title="タイトルへ戻る">ダメージ感覚</button></h1>
      <p id="snapshot"></p>
    </div>
    <div class="modes" role="group" aria-label="難易度">
      <button type="button" id="mode-easy" data-mode="easy">簡単</button>
      <button type="button" id="mode-normal" data-mode="normal">普通</button>
      <button type="button" id="mode-challenge" data-mode="challenge">チャレンジ</button>
    </div>
  </header>
  <div class="status" id="status"></div>
  <main id="main" class="stack"></main>
  <footer>
    <p>Lv50・能力ポイント制（最大32）。防御側はHP満タン・状態異常なし。使用率データ：<span id="source"></span></p>

  </footer>
</div>
