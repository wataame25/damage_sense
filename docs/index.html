<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>ダメージ感覚</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 対戦画面のように「攻撃側 → 技 → 防御側」を横一列に並べ、結果はHPバー上で見せる。スマホでは縦積み */
:root {
  --ground: #e9edf2;
  --surface: #ffffff;
  --surface-2: #f4f6f9;
  --ink: #17202b;
  --muted: #5b6676;
  --line: #d3dae3;
  --accent: #2c56d6;
  --accent-ink: #ffffff;
  --hp-good: #22a35f;
  --hp-warn: #e2a417;
  --hp-bad: #d8414a;
  --dmg: #d8414a;
  --dmg-soft: rgba(216, 65, 74, .28);
  --font-display: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", monospace;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0f141b;
    --surface: #18202a;
    --surface-2: #1f2834;
    --ink: #e6ebf2;
    --muted: #93a1b3;
    --line: #2b3644;
    --accent: #7d9cff;
    --accent-ink: #0f141b;
    --hp-good: #3cc47a;
    --hp-warn: #f0b93a;
    --hp-bad: #f0626a;
    --dmg: #f0626a;
    --dmg-soft: rgba(240, 98, 106, .3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0f141b;
  --surface: #18202a;
  --surface-2: #1f2834;
  --ink: #e6ebf2;
  --muted: #93a1b3;
  --line: #2b3644;
  --accent: #7d9cff;
  --accent-ink: #0f141b;
  --hp-good: #3cc47a;
  --hp-warn: #f0b93a;
  --hp-bad: #f0626a;
  --dmg: #f0626a;
  --dmg-soft: rgba(240, 98, 106, .3);
}

* { box-sizing: border-box; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  padding: 0 16px;
}
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 20px 48px; display: grid; gap: 16px; }
.stack { display: grid; gap: 16px; min-width: 0; }
/* グリッドの子要素が中身の幅で画面からはみ出さないようにする */
.wrap > *, .stack > *, .battle > *, .answer > *, .result > *, .summary > *, .calc > *, .calc-row > * { min-width: 0; }
.calc code { overflow-wrap: anywhere; }
.status span { overflow-wrap: anywhere; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- ヘッダー ---- */
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.brand { display: grid; gap: 2px; }
.brand h1 { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.1; margin: 0; letter-spacing: .04em; }
.brand p { margin: 0; color: var(--muted); font-size: 12px; }
.modes { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.modes button {
  border: 0; background: transparent; padding: 6px 16px; border-radius: 999px; cursor: pointer; font-size: 14px; color: var(--muted);
}
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

/* ---- 進行状況 ---- */
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 13px; color: var(--muted); }
.status strong { color: var(--ink); font-family: var(--font-data); font-weight: 500; }
.pips { display: flex; gap: 4px; }
.pip { width: 22px; height: 8px; border-radius: 2px; background: var(--line); }
.pip.done { background: var(--ink); }
.pip.now { background: var(--accent); }

/* ---- 対戦カード ---- */
.battle {
  display: grid; grid-template-columns: 1fr minmax(200px, 250px) 1fr; gap: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
}
.side { padding: 18px 20px; display: grid; gap: 10px; align-content: start; }
.side + .center, .center + .side { border-left: 1px solid var(--line); }
.role { font-size: 11px; letter-spacing: .14em; color: var(--muted); }
.mon-name { font-family: var(--font-display); font-size: 26px; line-height: 1.2; margin: 0; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.type {
  display: inline-block; font-size: 12px; padding: 1px 10px; border-radius: 4px; color: #fff; font-weight: 500;
  text-shadow: 0 1px 0 rgba(0,0,0,.25);
}
dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 14px; }
dl.facts dt { color: var(--muted); font-size: 12px; padding-top: 2px; }
dl.facts dd { margin: 0; }
.stat { display: grid; grid-template-columns: 4.5em auto 1fr; align-items: baseline; gap: 8px; }
.stat-val { font-family: var(--font-data); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat-note { font-size: 12px; color: var(--muted); }
.flag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); }
.flag.up { border-color: var(--accent); color: var(--accent); }
.flag.down { border-color: var(--hp-bad); color: var(--hp-bad); }
.spread { font-family: var(--font-data); font-size: 13px; font-variant-numeric: tabular-nums; }

.center { background: var(--surface-2); padding: 18px 16px; display: grid; gap: 14px; align-content: center; text-align: center; }
.move-name { font-family: var(--font-display); font-size: 24px; line-height: 1.2; margin: 0; }
.move-head { display: grid; gap: 10px; justify-items: center; }
.move-type { justify-content: center; }
.move-meta { font-size: 13px; color: var(--muted); display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 10px; }
.move-meta b { font-family: var(--font-data); color: var(--ink); font-weight: 500; }
.arrow { font-family: var(--font-display); color: var(--muted); font-size: 18px; letter-spacing: .3em; }
.env { display: grid; gap: 6px; font-size: 13px; }
.env div { display: flex; justify-content: space-between; gap: 8px; border-top: 1px dashed var(--line); padding-top: 6px; }
.env span:first-child { color: var(--muted); }
.env-note { margin: -2px 0 0; font-size: 11px; color: var(--muted); text-align: left; line-height: 1.5; }

/* ---- 回答 ---- */
.answer { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; display: grid; gap: 12px; }
.answer h2, .result h2 { font-size: 15px; margin: 0; font-weight: 700; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.choice {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface-2); cursor: pointer; text-align: left;
}
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice .key { font-family: var(--font-data); font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
.choice .range { font-family: var(--font-data); font-size: 18px; font-variant-numeric: tabular-nums; }
.choice.correct { border-color: var(--hp-good); box-shadow: inset 0 0 0 1px var(--hp-good); }
.choice.wrong { border-color: var(--hp-bad); box-shadow: inset 0 0 0 1px var(--hp-bad); }
.choice:disabled { cursor: default; }
.input-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.num { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 0 12px; }
.num input {
  width: 6.5em; border: 0; background: transparent; color: var(--ink); font-family: var(--font-data); font-size: 24px; padding: 8px 4px;
  font-variant-numeric: tabular-nums;
}
.num input:focus { outline: none; }
.num:focus-within { border-color: var(--accent); }
.num span { color: var(--muted); font-family: var(--font-data); font-size: 18px; }
.btn {
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 10px 20px;
  cursor: pointer; font-weight: 500;
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:disabled { opacity: .5; cursor: default; }

/* ---- 結果 ---- */
.result { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; display: grid; gap: 16px; }
.verdict { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.verdict .mark { font-family: var(--font-display); font-size: 28px; line-height: 1; }
.verdict .mark.ok { color: var(--hp-good); }
.verdict .mark.ng { color: var(--hp-bad); }
.verdict .sub { color: var(--muted); font-size: 14px; }
.verdict .sub b { font-family: var(--font-data); color: var(--ink); font-weight: 500; }

.hpbox { display: grid; gap: 6px; }
.hp-head { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); }
.hp-head b { font-family: var(--font-data); color: var(--ink); font-weight: 500; }
.hpbar { margin-top: 18px; position: relative; height: 22px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: visible; }
.hp-remain { position: absolute; inset: 0 auto 0 0; border-radius: 3px 0 0 3px; }
.hp-roll { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, var(--dmg-soft) 0 5px, transparent 5px 9px); border-left: 2px solid var(--dmg); border-right: 2px solid var(--dmg); }
.hp-guess { position: absolute; top: -6px; bottom: -6px; width: 0; border-left: 2px dashed var(--ink); }
.hp-guess span { position: absolute; top: -20px; left: 0; transform: translateX(-50%); font-size: 11px; font-family: var(--font-data); white-space: nowrap; background: var(--surface); padding: 0 4px; }
.hp-scale { position: relative; height: 16px; font-family: var(--font-data); font-size: 11px; color: var(--muted); }
.hp-scale span { position: absolute; transform: translateX(-50%); }
.hp-scale span:first-child { transform: none; }
.hp-scale span:last-child { transform: translateX(-100%); }
.hp-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); }
.sw { display: inline-block; width: 12px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }

.figures { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.fig { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; }
.fig span { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.fig b { font-family: var(--font-data); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }

details.breakdown { border-top: 1px solid var(--line); padding-top: 12px; }
details.breakdown summary { cursor: pointer; font-size: 14px; font-weight: 500; }
.calc { display: grid; gap: 6px; margin-top: 10px; font-size: 13px; }
.calc-row { display: grid; grid-template-columns: 7.5em 1fr; gap: 10px; }
.calc-row > span:first-child { color: var(--muted); }
.calc code { font-family: var(--font-data); font-size: 13px; }
.rolls { font-family: var(--font-data); font-size: 12px; color: var(--muted); overflow-x: auto; white-space: nowrap; }
.notes { margin: 0; padding-left: 1.2em; font-size: 13px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.kbd { font-size: 12px; color: var(--muted); align-self: center; }

/* ---- まとめ ---- */
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 20px; display: grid; gap: 16px; }
.summary h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; margin: 0; }
.big { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.big div { display: grid; }
.big span { font-size: 12px; color: var(--muted); }
.big b { font-family: var(--font-data); font-size: 32px; font-weight: 500; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 560px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
td.n { font-family: var(--font-data); font-variant-numeric: tabular-nums; text-align: right; }
th.n { text-align: right; }

.share { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.share h3 { margin: 0; font-size: 15px; }
.share-preview {
  margin: 0; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px;
  font-family: var(--font-body); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere;
}
a.btn { text-decoration: none; display: inline-flex; align-items: center; }
.big b.marks { font-family: var(--font-body); font-size: 24px; letter-spacing: .08em; }
footer { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
footer p { margin: 0; max-width: 72ch; }

.calc-row .flag { margin-left: 6px; font-size: 11px; }
@media (max-width: 760px) {
  /* スマホ：技と天候を上の帯に、攻撃側と防御側を左右に並べて1画面に収める */
  .wrap { padding-block: 10px 32px; gap: 10px; }
  .brand h1 { font-size: 22px; }
  .brand p { font-size: 11px; }
  .modes button { padding: 5px 12px; font-size: 13px; }
  .status { font-size: 12px; gap: 4px 12px; }
  .pip { width: 14px; height: 6px; }
  .battle { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "move move" "atk dfn"; }
  .side.atk { grid-area: atk; }
  .side.dfn { grid-area: dfn; }
  .center { grid-area: move; }
  .side + .center, .center + .side { border-left: 0; }
  .side.dfn { border-left: 1px solid var(--line); }
  .center { border-bottom: 1px solid var(--line); padding: 10px 12px; gap: 6px; text-align: left; }
  .move-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .arrow { display: none; }
  .move-name { font-size: 20px; }
  .move-type { justify-content: flex-start; }
  .move-meta { justify-content: flex-start; font-size: 12px; }
  .env { font-size: 12px; gap: 3px; }
  .env div { padding-top: 3px; }
  .env-note { font-size: 10px; }
  .side { padding: 10px; gap: 6px; }
  .role { font-size: 10px; }
  .mon-name { font-size: 17px; }
  .type { font-size: 11px; padding: 0 7px; }
  dl.facts { grid-template-columns: auto minmax(0, 1fr); gap: 2px 6px; font-size: 12px; }
  dl.facts dt { font-size: 10px; padding-top: 1px; }
  dl.facts dd { overflow-wrap: anywhere; }
  .flag { font-size: 10px; padding: 0 5px; }
  .spread { font-size: 11px; }
  .stat { grid-template-columns: auto minmax(0, 1fr); gap: 0 6px; }
  .stat-val { font-size: 18px; }
  .stat > .stat-note:last-child { grid-column: 1 / -1; font-size: 10px; }
  .answer, .result { padding: 14px; }
  .figures { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .choices { grid-template-columns: 1fr; gap: 8px; }
  .choice { padding: 9px 12px; }
  .calc-row { grid-template-columns: 1fr; gap: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .reveal { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>ダメージ感覚</h1>
      <p id="snapshot"></p>
    </div>
    <div class="modes" role="group" aria-label="難易度">
      <button type="button" id="mode-easy" data-mode="easy">簡単</button>
      <button type="button" id="mode-normal" data-mode="normal">普通</button>
      <button type="button" id="mode-challenge" data-mode="challenge">チャレンジ</button>
    </div>
  </header>
  <div class="status" id="status"></div>
  <main id="main" class="stack"></main>
  <footer>
    <p>Lv50・能力ポイント制（最大32）。防御側はHP満タン・状態異常なし。使用率データ：<span id="source"></span></p>
    <p>このサイトはファンが個人で制作した非公式のツールです。任天堂・株式会社ポケモン・クリーチャーズ・ゲームフリーク、およびバトルデータベース チャンピオンズとは一切関係ありません。ポケットモンスター・ポケモン・Pokémonは任天堂・クリーチャーズ・ゲームフリークの登録商標です。</p>
  </footer>

<script>// damage_sense 計算エンジン（main.py のJavaScript移植版）

  // ---------------------------------------------------------------- 基本部品

  function pokeRound(x) {
    var f = Math.floor(x);
    return x - f > 0.5 ? f + 1 : f;
  }

    return table[mult] !== undefined ? table[mult] : Math.round(mult * 4096);
  }
  function calcStat(base, points, nature, isHp) {
    if (isHp) return base + 75 + points;
    // 浮動小数の誤差を避けるため整数で計算（1.1倍→×11÷10、0.9倍→×9÷10）

  function applyRank(stat, stages) {
    if (stages >= 0) return Math.floor(stat * (2 + stages) / 2);
    return Math.floor(stat * 2 / (2 - stages));
  }

    var eff = 1;
    defTypes.forEach(function (t) {
      var m = TYPE_CHART[moveType][t];

      if (moveName === "フリーズドライ" && t === "みず") m = 2;

  function Combatant(row, ability) {

  };

    return this.row.types.indexOf("ひこう") < 0 && this.ability !== "ふゆう";

  function itemApplies(item, move, moveType, physical, eff) {

    var physical = move.category === "物理";
    var moveType = move.type;
    var basePower = move.power;

    }
    if (name === "だいちのはどう" && battle.field && atk.isGrounded()) {

    if (skinBoost) addP(4915, atk.ability);
    if (atk.ability === "テクニシャン" && basePower <= 60) addP(6144, "テクニシャン");
    if (atk.ability === "てつのこぶし" && PUNCH_MOVES[name]) addP(4915, "てつのこぶし");
    if (atk.ability === "メガランチャー" && PULSE_MOVES[name]) addP(6144, "メガランチャー");
    if (atk.ability === "かたいツメ" && move.makes_contact) addP(5325, "かたいツメ");
    if (atk.ability === "すてみ" && RECOIL_MOVES[name]) addP(4915, "すてみ");
    if (atk.ability === "すなのちから" && battle.weather === "sandstorm" &&
        (moveType === "いわ" || moveType === "じめん" || moveType === "はがね")) addP(5325, "すなのちから");
    if (name === "はたきおとす" && !dfn.row.is_mega) {
      addP(6144, "はたきおとす（道具あり）");
      notes.push("はたきおとす：防御側が道具を持っている前提で威力1.5倍");
    }
    if (name === "アクロバット") notes.push("アクロバット：攻撃側が道具を持っている前提で威力2倍にしない");
    if (atk.item && !FINAL_MOD_ITEMS[atk.item.name] && itemApplies(atk.item, move, moveType, physical, eff)) {
      addP(to4096(atk.item.multiplier), atk.item.name);
    }
    if (battle.field) {
      var fd = data.field[battle.field];
      if (atk.isGrounded() && fd.move_type_multiplier[moveType]) {
        addP(to4096(fd.move_type_multiplier[moveType]), fd.name);
      }
      if (dfn.isGrounded() && fd.defender_type_multiplier[moveType] &&
          (battle.field !== "grassy_terrain" || name === "じしん")) {
        addP(to4096(fd.defender_type_multiplier[moveType]), fd.name);
      }
    }
    var power = Math.max(1, applyMod(basePower, chainMods(pm)));

    // こうげき/とくこう
    var aKey = physical ? "attack" : "sp_attack";
    var aStat = atk.stat(aKey);
    var aStage = atk.boosts[aKey] || 0;
    if (name === "エレクトロビーム") {
      aStage = Math.min(6, aStage + (atk.ability === "あまのじゃく" ? -1 : 1));
      notes.push("エレクトロビーム：攻撃前にとくこうが1段階上がる（あめのため溜めなしで攻撃）");
    }
    if (dfnAbility === "てんねん") {
      if (aStage) trace.attack.push({ label: "てんねん（ランク無視）", mod: null });
      aStage = 0;
    }
    if (aStage) trace.attack.push({ label: "ランク" + (aStage > 0 ? "+" : "") + aStage, mod: null });
    aStat = applyRank(aStat, aStage);
    var am = [];
    if (atk.ability === "サンパワー" && battle.weather === "sunny" && !physical) {
      am.push(6144); trace.attack.push({ label: "サンパワー", mod: 6144 });
    }
    if (dfnAbility === "あついしぼう" && (moveType === "ほのお" || moveType === "こおり")) {
      am.push(2048); trace.attack.push({ label: "あついしぼう", mod: 2048 });
    }
    aStat = Math.max(1, applyMod(aStat, chainMods(am)));

    // ぼうぎょ/とくぼう
    var dKey = physical || TARGET_DEFENSE_SPECIAL_MOVES[name] ? "defense" : "sp_defense";
    var dStat = dfn.stat(dKey);
    if (atk.ability !== "てんねん") dStat = applyRank(dStat, dfn.boosts[dKey] || 0);
    var dm = [];
    if (battle.weather) {
      var wd = data.weather[battle.weather];
      Object.keys(wd.defender_stat_multiplier).forEach(function (t) {
        var rule = wd.defender_stat_multiplier[t];
        if (dfn.row.types.indexOf(t) >= 0 && rule.stat === dKey) {
          dm.push(to4096(rule.multiplier));
          trace.defense.push({ label: wd.name + "（" + t + "）", mod: to4096(rule.multiplier) });
        }
      });
    }
    dStat = Math.max(1, applyMod(dStat, chainMods(dm)));

    // 基本ダメージ
    var base = Math.floor(LEVEL * 2 / 5 + 2);
    base = Math.floor(base * power * aStat / dStat);
    base = Math.floor(base / 50) + 2;
    var baseDamage = base;

    // 中略：天候・急所
    if (battle.weather) {
      var wmul = data.weather[battle.weather].move_type_multiplier[moveType];
      if (wmul) {
        base = applyMod(base, to4096(wmul));
        trace.middle.push({ label: data.weather[battle.weather].name, mod: to4096(wmul) });
      }
    }
    if (ALWAYS_CRIT_MOVES[name]) {
      base = applyMod(base, 6144);
      trace.middle.push({ label: "急所", mod: 6144 });
      notes.push(name + "：必ず急所（1.5倍）");
    }

    // 後略：タイプ一致・相性・最終補正
    var stab = 0;
    if (atk.row.types.indexOf(moveType) >= 0 || atk.ability === "へんげんじざい" || atk.ability === "リベロ") {
      stab = atk.ability === "てきおうりょく" ? 8192 : 6144;
      trace.final.push({ label: atk.ability === "てきおうりょく" ? "タイプ一致（てきおうりょく）" : "タイプ一致", mod: stab });
    }
    trace.final.push({ label: "タイプ相性", mod: null, value: eff });
    var fm = [];
    if (dfnAbility === "マルチスケイル") { fm.push(2048); trace.final.push({ label: "マルチスケイル", mod: 2048 }); }
    if (dfnAbility === "はどうのぼうご" && move.makes_contact) { fm.push(2048); trace.final.push({ label: "はどうのぼうご", mod: 2048 }); }
    if (atk.item && FINAL_MOD_ITEMS[atk.item.name] && itemApplies(atk.item, move, moveType, physical, eff)) {
      fm.push(FINAL_MOD_ITEMS[atk.item.name]);
      trace.final.push({ label: atk.item.name, mod: FINAL_MOD_ITEMS[atk.item.name] });
    }
    var finalMod = chainMods(fm);

    var damages = [];
    for (var r = 85; r <= 100; r++) {
      var d = Math.floor(base * r / 100);
      if (stab) d = applyMod(d, stab);
      d = Math.floor(d * eff);
      d = applyMod(d, finalMod);
      damages.push(Math.max(1, d));
    }
    var hp = dfn.stat("hp");
    return {
      move: move, moveType: moveType, basePower: basePower, power: power,
      attackStat: aStat, defenseStat: dStat, defenseKey: dKey, baseDamage: baseDamage,
      damages: damages, hp: hp, effectiveness: eff, notes: notes, trace: trace,
      minDamage: damages[0], maxDamage: damages[15],
      minPercent: damages[0] / hp * 100, maxPercent: damages[15] / hp * 100
    };
  }

  // ---------------------------------------------------------------- 出題

  function makeRng(seed) {
    if (seed === undefined || seed === null) return Math.random;
    var a = seed >>> 0;
    return function () { // mulberry32
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function choice(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }
  function weighted(rng, arr, weights) {
    var total = weights.reduce(function (a, b) { return a + b; }, 0);
    var x = rng() * total;
    for (var i = 0; i < arr.length; i++) { x -= weights[i]; if (x < 0) return arr[i]; }
    return arr[arr.length - 1];
  }

  function indexData(raw) {
    var byId = function (list) { var o = {}; list.forEach(function (x) { o[x.id] = x; }); return o; };
    var species = {};
    raw.pokemon.forEach(function (row) {
      var key = row.mega_of || row.id;
      (species[key] = species[key] || []).push(row);
    });
    return {
      pokemon: raw.pokemon, species: species, speciesKeys: Object.keys(species),
      moves: byId(raw.moves), abilities: byId(raw.abilities), items: byId(raw.items),
      weather: byId(raw.weather), field: byId(raw.field), evRules: raw.ev_rules,
      snapshot: raw.usage_snapshot ? raw.usage_snapshot[0] : null
    };
  }

  function pickForm(rows, rng) {
    var fixed = rows.filter(function (r) { return r.form_selection === "fixed"; });
    if (fixed.length) return fixed[0];
    return choice(rng, rows.filter(function (r) { return r.form_selection === "random"; }));
  }
  function pickAbility(data, row, rng) {
    var u = row.ability_usage;
    var chosen = weighted(rng, u, u.map(function (x) { return x.usage_rate; }));
    return data.abilities[chosen.ability_id].name;
  }
  function pickItem(data, row, rng) {
    if (row.is_mega) return null;
    var roll = rng() * 100, acc = 0;
    var cands = row.item_candidates || [];
    for (var i = 0; i < cands.length; i++) {
      var item = data.items[cands[i].item_id];
      if (item.multiplier < 1.2 || cands[i].usage_rate < USAGE_THRESHOLD) continue;
      acc += cands[i].usage_rate;
      if (roll < acc) return item;
    }
    return null;
  }
  function makeCombatant(data, row, rng, role) {
    var c = new Combatant(row, pickAbility(data, row, rng));
    pickSpreadAndNature(row, rng, c);
    if (role === "attacker") {
      c.item = pickItem(data, row, rng);
      // 積み技は振り方に合うもの（AS振りならこうげきが上がる技）だけを使用済みにする
      var stats = attackingStats(c);
      var boostMoves = row.moves.map(function (m) { return data.moves[m]; })
        .filter(function (m) {
          return BOOST_MOVES[m.name] && m.boosts_own_stat.some(function (b) { return stats.indexOf(b.stat) >= 0; });
        });
      if (boostMoves.length && row.boost_move_used_flag_eligible && rng() < P_BOOST_USED) {
        var bm = choice(rng, boostMoves);
        c.boostMove = bm.name;
        var sign = c.ability === "あまのじゃく" ? -1 : 1;
        bm.boosts_own_stat.forEach(function (b) {
          c.boosts[b.stat] = Math.max(-6, Math.min(6, (c.boosts[b.stat] || 0) + sign * b.stages));
        });
      }
    }
    return c;
  }
  // 採用率10%以上の振り方・性格から、採用率で重み付けして選ぶ（攻撃側・防御側共通）
  function pickSpreadAndNature(row, rng, c) {
    var groups = row.stat_point_usage;
    var group = weighted(rng, groups, groups.map(function (g) { return g.usage_rate; }));
    var spread = weighted(rng, group.spreads, group.spreads.map(function (x) { return x.usage_rate; }));
    c.points = Object.assign({}, spread.points);
    c.spreadLabel = spread.label;
    // 振り方に合う性格のみ：特化側（16ポイント以上振ったステータス）を上げ、特化側を下げない性格
    var natures = row.nature_usage.filter(function (n) {
      var inv = function (k) { return k && k !== "hp" && c.points[k] >= INVESTED_POINTS; };
      return inv(n.up) && !inv(n.down);
    });
    if (!natures.length) natures = row.nature_usage;
    var nature = weighted(rng, natures, natures.map(function (n) { return n.usage_rate; }));
    c.natureName = nature.name;
    c.nature = {};
    if (nature.up) c.nature[nature.up] = 1.1;
    if (nature.down) c.nature[nature.down] = 0.9;
  }
  // 天候/フィールドを発生させる特性の持ち主を決める（main.py の resolve_setter と同じ規則）。
  // 特性を持つポケモンがいなければ発生しない。両方が持つ場合は後から発動した方で上書き：
  //   1. メガシンカしたポケモン  2. すばやさが遅いポケモン  3. 同速ならランダム
  function resolveSetter(atk, dfn, setters, rng) {
    var cands = [atk, dfn].filter(function (c) { return setters[c.ability]; });
    if (!cands.length) return { id: null, note: null };
    if (cands.length === 1) return { id: setters[cands[0].ability], note: cands[0].row.name + "の" + cands[0].ability };
    var a = cands[0], d = cands[1], win, lose, why;
    if (a.row.is_mega !== d.row.is_mega) {
      win = a.row.is_mega ? a : d; lose = win === a ? d : a;
      why = "メガシンカした" + win.row.name + "が後から発動して" + lose.row.name + "の" + lose.ability + "を上書き";
    } else if (a.stat("speed") !== d.stat("speed")) {
      win = a.stat("speed") < d.stat("speed") ? a : d; lose = win === a ? d : a;
      why = "すばやさが遅い" + win.row.name + "（" + win.stat("speed") + "）が後から発動して" +
        lose.row.name + "（" + lose.stat("speed") + "）の" + lose.ability + "を上書き";
    } else {
      win = choice(rng, cands); lose = win === a ? d : a;
      why = "同速（" + win.stat("speed") + "）のためランダムで" + win.row.name + "が後から発動";
    }
    return { id: setters[win.ability], note: win.row.name + "の" + win.ability + "（" + why + "）" };
  }
  function decideBattle(atk, dfn, rng) {
    var w = resolveSetter(atk, dfn, WEATHER_SETTERS, rng);
    var f = resolveSetter(atk, dfn, FIELD_SETTERS, rng);
    return { weather: w.id, field: f.id, weatherNote: w.note, fieldNote: f.note };
  }
  // 振り方から攻撃側の戦い方を決める：こうげき/とくこうのうち16ポイント以上振った方（両方・どちらも無しなら両方）
  function attackingStats(c) {
    var inv = ["attack", "sp_attack"].filter(function (k) { return (c.points[k] || 0) >= INVESTED_POINTS; });
    return inv.length === 1 ? inv : ["attack", "sp_attack"];
  }
  // 振り方に合う分類の技だけを使う（AS振りなら物理技、CS振りなら特殊技）
  function bestMove(data, atk, dfn, battle) {
    var best = null;
    var cats = attackingStats(atk).map(function (k) { return k === "attack" ? "物理" : "特殊"; });
    atk.row.moves.forEach(function (m) {
      if (cats.indexOf(data.moves[m].category) < 0) return;
      var r = calcDamage(data, atk, dfn, data.moves[m], battle);
      if (!r) return;
      if (!best || r.maxDamage > best.maxDamage ||
          (r.maxDamage === best.maxDamage && r.minDamage > best.minDamage)) best = r;
    });
    return best;
  }
  function generateQuestion(data, rng) {
    for (var i = 0; i < 1000; i++) {
      var keys = data.speciesKeys;
      var ai = Math.floor(rng() * keys.length);
      var di = Math.floor(rng() * (keys.length - 1));
      if (di >= ai) di++;
      var aRow = pickForm(data.species[keys[ai]], rng);
      if (aRow.is_defensive_only) continue;
      var dRow = pickForm(data.species[keys[di]], rng);
      var atk = makeCombatant(data, aRow, rng, "attacker");
      var dfn = makeCombatant(data, dRow, rng, "defender");
      var battle = decideBattle(atk, dfn, rng);
      var result = bestMove(data, atk, dfn, battle);
      if (!result || result.minPercent > MAX_MIN_PERCENT) continue;
      return {
        attacker: atk, defender: dfn, battle: battle, result: result,
        answer: Math.min(ANSWER_CAP, result.minPercent)
      };
    }
    throw new Error("条件を満たす問題を生成できませんでした");
  }

  return {
    indexData: indexData, generateQuestion: generateQuestion, calcDamage: calcDamage,
    Combatant: Combatant, makeRng: makeRng, calcStat: calcStat, typeEffectiveness: typeEffectiveness,
    decideBattle: decideBattle, MAX_MIN_PERCENT: MAX_MIN_PERCENT, ANSWER_CAP: ANSWER_CAP
  };
})();
</script>
<script>// damage_sense 画面ロジック。計算は engine.js（DamageEngine）に任せる
(function () {
  "use strict";

  var E = DamageEngine;
  var data = E.indexData(GAME_DATA);
  var rng = E.makeRng();
  var NORMAL_TOLERANCE = 5;
  var CHALLENGE_QUESTIONS = 10;
  var BEST_KEY = "damage_sense.challengeBest";
  var SITE_URL = "https://wataame25.github.io/damage_sense/";  // 共有時に付けるリンク（GitHub Pages）
  var SHARE_TAG = "#ダメージ感覚";

  var TYPE_COLOR = {
    "ノーマル": "#9a9a7a", "ほのお": "#e8742f", "みず": "#4a86e8", "でんき": "#d9ad1c", "くさ": "#5aa83e",
    "こおり": "#4fb7b3", "かくとう": "#b8322b", "どく": "#9a43a0", "じめん": "#c69a45", "ひこう": "#8c7fd9",
    "エスパー": "#e8507c", "むし": "#93a51f", "いわ": "#a99037", "ゴースト": "#6a5394", "ドラゴン": "#6236e0",
    "あく": "#6b5546", "はがね": "#8f8fac", "フェアリー": "#d97ba6"
  };
  var STAT_LABEL = { hp: "HP", attack: "こうげき", defense: "ぼうぎょ", sp_attack: "とくこう", sp_defense: "とくぼう" };

  var state = { mode: "easy", q: null, answered: false, history: [], options: null, guess: null, finished: false };

  var $main = document.getElementById("main");
  var $status = document.getElementById("status");

  // ------------------------------------------------------------ 小物

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pct(x) { return x.toFixed(1) + "%"; }
  function typeChip(t) { return '<span class="type" style="background:' + (TYPE_COLOR[t] || "#888") + '">' + esc(t) + "</span>"; }
  function storageGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function storageSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* 保存できなくても続行 */ } }
  function sampleN(arr, n) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rng() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a.slice(0, n);
  }

  function itemLabel(c) {
    if (!c.item) return "なし（火力アップ系以外）";
    var rule = c.item.applies_to, target;
    if (c.item.name === "たつじんのおび") target = "効果バツグンの技";
    else if (rule.move_type) target = rule.move_type + "技";
    else if (rule.move_category) target = rule.move_category + "技";
    else target = "全ての攻撃技";
    return esc(c.item.name) + ' <span class="flag up">' + esc(target) + " ×" + c.item.multiplier + "</span>";
  }
  function statBlock(c, key) {
    var n = c.nature[key] || 1;
    var nat = n > 1 ? ' ・ <span class="flag up">性格↑</span>' : n < 1 ? ' ・ <span class="flag down">性格↓</span>' : "";
    return '<div class="stat"><span class="stat-note">' + STAT_LABEL[key] + '</span><span class="stat-val">' + c.stat(key) +
      '</span><span class="stat-note">種族値' + c.row.base_stats[key] + " ・ " + (c.points[key] || 0) + "振り" + nat + "</span></div>";
  }
  var STAT_SHORT = { hp: "H", attack: "A", defense: "B", sp_attack: "C", sp_defense: "D", speed: "S" };
  function natureLabel(c) {
    var up = Object.keys(c.nature).filter(function (k) { return c.nature[k] > 1; })[0];
    var down = Object.keys(c.nature).filter(function (k) { return c.nature[k] < 1; })[0];
    return esc(c.natureName) + (up ? '<span class="stat-note">（' + STAT_SHORT[up] + "↑" + STAT_SHORT[down] + "↓）</span>" : "");
  }
  function spreadLabel(c) {
    var parts = ["hp", "attack", "defense", "sp_attack", "sp_defense", "speed"].filter(function (k) { return c.points[k]; })
      .map(function (k) { return STAT_SHORT[k] + c.points[k]; });
    return '<span class="spread">' + (parts.join(" ") || "無振り") + "</span>";
  }
  // 確定数（防御側はHP満タン、乱数は16通り）
  function koLabel(r) {
    if (r.minDamage >= r.hp) return "確定1発";
    if (r.maxDamage >= r.hp) return "乱数1発";
    for (var n = 2; n <= 6; n++) {
      if (r.minDamage * n >= r.hp) return "確定" + n + "発";
      if (r.maxDamage * n >= r.hp) return "乱数" + n + "発";
    }
    return "7発以上";
  }

  // ------------------------------------------------------------ 出題

  function newQuestion() {
    state.q = E.generateQuestion(data, rng);
    state.answered = false;
    state.guess = null;
    state.options = state.mode === "easy" ? makeChoices(state.q) : null;
    render();
    window.scrollTo(0, 0);
    var input = document.getElementById("guess");
    if (input) input.focus({ preventScroll: true });
  }

  // 4択：正解レンジ＋倍率をずらしたダミー3つ（main.py の easy_choices と同じ考え方）
  function makeChoices(q) {
    var lo = q.result.minPercent, hi = q.result.maxPercent;
    var opts = [{ lo: lo, hi: hi, correct: true }].concat(
      sampleN([0.5, 0.67, 0.8, 1.25, 1.5, 2.0], 3).map(function (f) { return { lo: lo * f, hi: hi * f, correct: false }; }));
    return sampleN(opts, 4);
  }

  function submitChoice(i) {
    if (state.answered) return;
    var opt = state.options[i];
    state.answered = true;
    state.guess = { choice: i, correct: opt.correct };
    record(opt.correct, null);
    render();
  }

  function submitNumber() {
    if (state.answered) return;
    var input = document.getElementById("guess");
    var v = parseFloat(input.value);
    var err = document.getElementById("guess-error");
    if (isNaN(v) || v < 0) { err.textContent = "0以上の数値を入力してください（例: 42.5）"; input.focus(); return; }
    var diff = Math.abs(v - state.q.answer);
    state.answered = true;
    state.guess = { value: v, diff: diff, correct: diff <= NORMAL_TOLERANCE };
    record(state.guess.correct, diff);
    render();
  }

  function record(correct, diff) {
    var q = state.q;
    state.history.push({
      attacker: q.attacker.row.name, defender: q.defender.row.name, move: q.result.move.name,
      answer: q.answer, guess: state.guess.value, diff: diff, correct: correct
    });
  }

  function next() {
    if (state.mode === "challenge" && state.history.length >= CHALLENGE_QUESTIONS) { finish(); return; }
    newQuestion();
  }

  function finish() {
    state.finished = true;
    if (state.mode === "challenge") {
      var total = state.history.reduce(function (a, h) { return a + h.diff; }, 0);
      var best = parseFloat(storageGet(BEST_KEY));
      state.prevBest = isNaN(best) ? null : best;
      if (isNaN(best) || total < best) storageSet(BEST_KEY, String(total));
    }
    render();
    window.scrollTo(0, 0);
  }

  function setMode(mode) {
    state.mode = mode;
    state.history = [];
    state.finished = false;
    newQuestion();
  }

  // ------------------------------------------------------------ 描画

  function renderStatus() {
    var h = state.history;
    var html = "";
    if (state.mode === "challenge") {
      html += '<div class="pips" aria-label="進行状況">';
      for (var i = 0; i < CHALLENGE_QUESTIONS; i++) {
        var cls = i < h.length ? "done" : (i === h.length && !state.finished ? "now" : "");
        html += '<span class="pip ' + cls + '"></span>';
      }
      html += "</div>";
      var total = h.reduce(function (a, x) { return a + x.diff; }, 0);
      html += "<span>第<strong>" + Math.min(h.length + (state.answered || state.finished ? 0 : 1), CHALLENGE_QUESTIONS) +
        "</strong>問 / " + CHALLENGE_QUESTIONS + "</span><span>誤差の合計 <strong>" + total.toFixed(1) + "%</strong></span>";
      var best = parseFloat(storageGet(BEST_KEY));
      if (!isNaN(best)) html += "<span>自己ベスト <strong>" + best.toFixed(1) + "%</strong></span>";
    } else {
      var ok = h.filter(function (x) { return x.correct; }).length;
      html += "<span>回答 <strong>" + h.length + "</strong>問</span><span>正解 <strong>" + ok + "</strong>問</span>";
      html += state.mode === "easy" ? "<span>4択から最低〜最高乱数の割合を選ぶ</span>"
        : "<span>最低乱数の割合を入力、誤差±" + NORMAL_TOLERANCE + "%以内で正解</span>";
    }
    $status.innerHTML = html;
    document.querySelectorAll(".modes button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.mode === state.mode));
    });
  }

  function renderBattle(q) {
    var a = q.attacker, d = q.defender, r = q.result;
    var physical = r.move.category === "物理";
    var aKey = physical ? "attack" : "sp_attack", dKey = r.defenseKey;
    var boost = "";
    if (a.boostMove) {
      var st = a.boosts[aKey] || 0;
      boost = "<dt>強化</dt><dd>" + esc(a.boostMove) + "を1回使用済み" +
        (st ? ' <span class="flag up">' + STAT_LABEL[aKey] + "ランク" + (st > 0 ? "+" : "") + st + "</span>" : "（" + STAT_LABEL[aKey] + "は変化なし）") + "</dd>";
    }
    var w = q.battle.weather ? data.weather[q.battle.weather].name : "なし";
    var f = q.battle.field ? data.field[q.battle.field].name : "なし";
    var typeChanged = r.moveType !== r.move.type;
    return '<section class="battle" aria-label="出題">' +
      '<div class="side atk"><div class="role">攻撃側</div><h2 class="mon-name">' + esc(a.row.name) + "</h2>" +
      '<div class="chips">' + a.row.types.map(typeChip).join("") + "</div>" +
      '<dl class="facts"><dt>特性</dt><dd>' + esc(a.ability) + "</dd><dt>持ち物</dt><dd>" + itemLabel(a) + "</dd>" + boost +
      "<dt>性格</dt><dd>" + natureLabel(a) + "</dd><dt>振り方</dt><dd>" + spreadLabel(a) + "</dd></dl>" +
      statBlock(a, aKey) + "</div>" +
      '<div class="center"><div class="move-head"><div class="arrow">▶▶</div><h2 class="move-name">' + esc(r.move.name) + "</h2>" +
      '<div class="chips move-type">' + typeChip(r.moveType) + "</div>" +
      '<div class="move-meta"><span>' + esc(r.move.category) + "</span><span>威力 <b>" + r.basePower + "</b></span>" +
      (typeChanged ? "<span>（" + esc(r.move.type) + "→" + esc(r.moveType) + "）</span>" : "") + "</div></div>" +
      '<div class="env"><div><span>天候</span><span>' + esc(w) + "</span></div>" +
      (q.battle.weatherNote ? '<p class="env-note">' + esc(q.battle.weatherNote) + "</p>" : "") +
      "<div><span>フィールド</span><span>" + esc(f) + "</span></div>" +
      (q.battle.fieldNote ? '<p class="env-note">' + esc(q.battle.fieldNote) + "</p>" : "") + "</div></div>" +
      '<div class="side dfn"><div class="role">防御側</div><h2 class="mon-name">' + esc(d.row.name) + "</h2>" +
      '<div class="chips">' + d.row.types.map(typeChip).join("") + "</div>" +
      '<dl class="facts"><dt>特性</dt><dd>' + esc(d.ability) + "</dd><dt>性格</dt><dd>" + natureLabel(d) +
      "</dd><dt>振り方</dt><dd>" + spreadLabel(d) + "</dd></dl>" +
      statBlock(d, "hp") + statBlock(d, dKey) + "</div>" +
      "</section>";
  }

  function renderAnswer(q) {
    if (state.mode === "easy") {
      var html = '<section class="answer"><h2>ダメージの割合（最低〜最高乱数）は？</h2><div class="choices">';
      state.options.forEach(function (o, i) {
        var cls = "";
        if (state.answered) cls = o.correct ? "correct" : (state.guess.choice === i ? "wrong" : "");
        html += '<button type="button" class="choice ' + cls + '" data-choice="' + i + '"' + (state.answered ? " disabled" : "") +
          '><span class="key">' + (i + 1) + '</span><span class="range">' + pct(o.lo) + " 〜 " + pct(o.hi) + "</span></button>";
      });
      return html + "</div></section>";
    }
    return '<section class="answer"><h2>最低乱数のダメージは防御側HPの何%？</h2>' +
      '<form class="input-row" id="guess-form" novalidate><label class="num" for="guess"><input id="guess" type="number" inputmode="decimal" step="0.1" min="0" placeholder="0.0"' +
      (state.answered ? " disabled value=\"" + state.guess.value + "\"" : "") + '><span>%</span></label>' +
      '<button class="btn" type="submit"' + (state.answered ? " disabled" : "") + ">回答する</button></form>" +
      '<p class="hint" id="guess-error" role="alert"></p>' +
      '<p class="hint">' + (state.mode === "normal" ? "誤差±" + NORMAL_TOLERANCE + "%以内で正解。" : "") +
      "最低乱数が100%を超える場合は100と入力。</p></section>";
  }

  function hpBar(r, guessPct) {
    // 0〜100% を表示。最低乱数〜最高乱数の削り幅を斜線、残りHPを色で表す
    var lo = Math.min(100, r.minPercent), hi = Math.min(100, r.maxPercent);
    var remain = 100 - lo;
    var color = remain > 50 ? "var(--hp-good)" : remain > 20 ? "var(--hp-warn)" : "var(--hp-bad)";
    // 左端から残りHPを描き、右側（削られた分）を空ける
    var html = '<div class="hpbox"><div class="hp-head"><span>' + esc(state.q.defender.row.name) + " の残りHP</span><span><b>" +
      Math.max(0, r.hp - r.maxDamage) + "〜" + Math.max(0, r.hp - r.minDamage) + "</b> / " + r.hp + "</span></div>" +
      '<div class="hpbar" role="img" aria-label="ダメージ ' + pct(r.minPercent) + "〜" + pct(r.maxPercent) + '">' +
      '<div class="hp-remain" style="width:' + (100 - hi) + "%;background:" + color + '"></div>' +
      '<div class="hp-roll" style="left:' + (100 - hi) + "%;width:" + (hi - lo) + '%"></div>';
    if (guessPct !== null && guessPct !== undefined) {
      var g = Math.max(0, Math.min(100, guessPct));
      html += '<div class="hp-guess" style="left:' + (100 - g) + '%"><span>回答 ' + pct(guessPct) + "</span></div>";
    }
    html += '</div><div class="hp-scale"><span style="left:0">HP 0%</span><span style="left:50%">50%</span><span style="left:100%">100%</span></div>' +
      '<div class="hp-legend"><span><i class="sw" style="background:' + color + '"></i>最高乱数でも残るHP</span>' +
      '<span><i class="sw" style="background:repeating-linear-gradient(135deg,var(--dmg-soft) 0 3px,transparent 3px 5px);border:1px solid var(--dmg)"></i>乱数で変わる幅</span>' +
      (guessPct !== null && guessPct !== undefined ? '<span><i class="sw" style="border-left:2px dashed var(--ink);border-radius:0;width:6px"></i>あなたの回答（右端からの削り）</span>' : "") +
      "</div></div>";
    return html;
  }

  function modLabel(m) {
    if (m.mod === null || m.mod === undefined) return esc(m.label) + (m.value !== undefined ? " ×" + m.value : "");
    return esc(m.label) + " ×" + (m.mod / 4096).toFixed(m.mod % 1024 === 0 ? 1 : 2) + "<span class=\"stat-note\">（" + m.mod + "/4096）</span>";
  }
  // 実数値の計算式（能力補正＝性格込み）
  function statFormula(c, key) {
    var b = c.row.base_stats[key], p = c.points[key] || 0, n = c.nature[key] || 1, v = c.stat(key);
    if (key === "hp") return b + " + 75 + " + p + " = " + v;
    if (n === 1) return b + " + 20 + " + p + " = " + v;
    return "floor((" + b + " + 20 + " + p + ") × " + n + ") = " + v;
  }
  function natureNote(c, key) {
    var n = c.nature[key] || 1;
    return n > 1 ? '<span class="flag up">能力補正↑ ×1.1</span>' : n < 1 ? '<span class="flag down">能力補正↓ ×0.9</span>' : "";
  }
  function statRow(label, c, key, list, used) {
    var html = "<code>" + statFormula(c, key) + "</code>" + natureNote(c, key);
    if (list && list.length) html += "　" + list.map(modLabel).join("、") + " → <code>" + used + "</code>";
    return '<div class="calc-row"><span>' + label + "</span><span>" + html + "</span></div>";
  }

  function traceRow(label, list, extra) {
    var body = list.length ? list.map(modLabel).join("、") : "なし";
    return '<div class="calc-row"><span>' + label + "</span><span>" + (extra ? extra + "　" : "") + body + "</span></div>";
  }

  function renderResult(q) {
    var r = q.result, g = state.guess, head;
    if (state.mode === "easy") {
      head = '<span class="mark ' + (g.correct ? "ok" : "ng") + '">' + (g.correct ? "正解！" : "不正解") + "</span>" +
        '<span class="sub">正解は <b>' + pct(r.minPercent) + " 〜 " + pct(r.maxPercent) + "</b></span>";
    } else {
      var label = state.mode === "challenge" ? "誤差 " + g.diff.toFixed(1) + "%" : (g.correct ? "正解！" : "不正解");
      var cls = g.correct ? "ok" : "ng";
      head = '<span class="mark ' + cls + '">' + label + "</span>" +
        '<span class="sub">正解 <b>' + pct(q.answer) + "</b>　あなたの回答 <b>" + pct(g.value) + "</b>" +
        (state.mode === "challenge" ? "" : "　誤差 <b>" + g.diff.toFixed(1) + "%</b>") + "</span>";
    }
    var last = state.mode === "challenge" && state.history.length >= CHALLENGE_QUESTIONS;
    var nextLabel = last ? "結果を見る" : "次の問題";
    var t = r.trace;
    var html = '<section class="result reveal" aria-live="polite"><div class="verdict">' + head + "</div>" +
      hpBar(r, state.mode === "easy" ? null : Math.min(100, g.value)) +
      '<div class="figures">' +
      '<div class="fig"><span>ダメージ</span><b>' + r.minDamage + "〜" + r.maxDamage + "</b></div>" +
      '<div class="fig"><span>割合</span><b>' + pct(r.minPercent) + "〜" + pct(r.maxPercent) + "</b></div>" +
      '<div class="fig"><span>タイプ相性</span><b>×' + r.effectiveness + "</b></div>" +
      '<div class="fig"><span>確定数</span><b>' + koLabel(r) + "</b></div></div>" +
      '<details class="breakdown"><summary>計算の内訳</summary><div class="calc">' +
      traceRow("威力", t.power, "<code>" + r.basePower + " → " + r.power + "</code>") +
      '<div class="calc-row"><span>実数値の式</span><span class="stat-note">(種族値 + 20 + 能力ポイント) × 能力補正 ／ HP = 種族値 + 75 + 能力ポイント</span></div>' +
      statRow(r.move.category === "物理" ? "こうげき" : "とくこう", q.attacker,
        r.move.category === "物理" ? "attack" : "sp_attack", t.attack, r.attackStat) +
      statRow(STAT_LABEL[r.defenseKey], q.defender, r.defenseKey, t.defense, r.defenseStat) +
      statRow("HP", q.defender, "hp") +
      '<div class="calc-row"><span>基本ダメージ</span><span><code>floor(floor(22 × ' + r.power + " × " + r.attackStat + " ÷ " + r.defenseStat +
      ") ÷ 50) + 2 = " + r.baseDamage + "</code></span></div>" +
      traceRow("中略（乱数前）", t.middle) +
      traceRow("後略（乱数後）", t.final) +
      '<div class="calc-row"><span>乱数16通り</span><span class="rolls">' + r.damages.join(" ") + "</span></div>" +
      '<div class="calc-row"><span>割合</span><span><code>' + r.minDamage + " ÷ " + r.hp + " = " + pct(r.minPercent) +
      "</code> 〜 <code>" + r.maxDamage + " ÷ " + r.hp + " = " + pct(r.maxPercent) + "</code></span></div>" +
      "</div>" + (r.notes.length ? '<ul class="notes">' + r.notes.map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("") + "</ul>" : "") +
      "</details>" +
      '<div class="actions"><button class="btn" type="button" id="next">' + nextLabel + "</button>" +
      (state.mode !== "challenge" ? '<button class="btn ghost" type="button" id="quit">やめる</button>' : "") +
      '<span class="kbd">Enterで' + nextLabel + "</span></div></section>";
    return html;
  }

  // 1問ごとの誤差を記号に：◎2%以内 ○5%以内 △10%以内 ×それ以上
  function errorMark(diff) { return diff <= 2 ? "◎" : diff <= 5 ? "○" : diff <= 10 ? "△" : "×"; }

  function shareText() {
    var h = state.history;
    var total = h.reduce(function (a, x) { return a + x.diff; }, 0);
    var season = data.snapshot ? "（シーズン" + data.snapshot.snapshot_id.replace("_single", "") + "）" : "";
    return "ダメージ感覚 チャレンジ" + season + "\n" +
      "誤差の合計 " + total.toFixed(1) + "%（1問あたり " + (total / h.length).toFixed(1) + "%）\n" +
      h.map(function (x) { return errorMark(x.diff); }).join("") + "\n" + SHARE_TAG;
  }

  function renderShare() {
    var text = shareText();
    var xUrl = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text) + "&url=" + encodeURIComponent(SITE_URL);
    return '<div class="share"><h3>結果を共有</h3>' +
      '<pre class="share-preview" id="share-preview">' + esc(text + "\n" + SITE_URL) + "</pre>" +
      '<div class="actions">' +
      '<a class="btn" id="share-x" href="' + esc(xUrl) + '" target="_blank" rel="noopener noreferrer">Xで共有</a>' +
      '<button class="btn ghost" type="button" id="share-copy">結果をコピー</button>' +
      (navigator.share ? '<button class="btn ghost" type="button" id="share-native">その他のアプリで共有</button>' : "") +
      '<span class="kbd" id="share-status" role="status"></span></div></div>';
  }

  function copyShare() {
    var status = document.getElementById("share-status");
    var full = shareText() + "\n" + SITE_URL;
    var done = function () { status.textContent = "コピーしました"; };
    var fail = function () {
      // クリップボードが使えない環境では、プレビュー欄を選択状態にして手動コピーしてもらう
      var range = document.createRange();
      range.selectNodeContents(document.getElementById("share-preview"));
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      status.textContent = "コピーできませんでした。選択された文章をコピーしてください";
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(full).then(done, fail);
      else fail();
    } catch (e) { fail(); }
  }

  function renderSummary() {
    var h = state.history;
    var html = '<section class="summary reveal"><h2>' + (state.mode === "challenge" ? "チャレンジ結果" : "おつかれさまでした") + "</h2><div class=\"big\">";
    if (state.mode === "challenge") {
      var total = h.reduce(function (a, x) { return a + x.diff; }, 0);
      html += "<div><span>誤差の合計</span><b>" + total.toFixed(1) + "%</b></div><div><span>1問あたり</span><b>" + (total / h.length).toFixed(1) + "%</b></div>";
      if (state.prevBest !== null && state.prevBest !== undefined) {
        html += "<div><span>これまでの自己ベスト</span><b>" + state.prevBest.toFixed(1) + "%</b></div>";
      }
      html += '<div><span>1問ごと（◎2%以内 ○5%以内 △10%以内 ×それ以上）</span><b class="marks">' +
        h.map(function (x) { return errorMark(x.diff); }).join("") + "</b></div>";
    } else {
      var ok = h.filter(function (x) { return x.correct; }).length;
      html += "<div><span>回答</span><b>" + h.length + "問</b></div><div><span>正解</span><b>" + ok + "問</b></div>";
      if (h.length) html += "<div><span>正答率</span><b>" + Math.round(ok / h.length * 100) + "%</b></div>";
    }
    html += "</div>";
    if (h.length) {
      html += '<div class="table-wrap"><table><thead><tr><th>#</th><th>攻撃側</th><th>技</th><th>防御側</th><th class="n">正解</th>' +
        (state.mode === "easy" ? "<th>結果</th>" : '<th class="n">回答</th><th class="n">誤差</th>') + "</tr></thead><tbody>";
      h.forEach(function (x, i) {
        html += '<tr><td class="n">' + (i + 1) + "</td><td>" + esc(x.attacker) + "</td><td>" + esc(x.move) + "</td><td>" + esc(x.defender) +
          '</td><td class="n">' + pct(x.answer) + "</td>" +
          (state.mode === "easy" ? "<td>" + (x.correct ? "正解" : "不正解") + "</td>"
            : '<td class="n">' + pct(x.guess) + '</td><td class="n">' + x.diff.toFixed(1) + "%</td>") + "</tr>";
      });
      html += "</tbody></table></div>";
    }
    if (state.mode === "challenge" && h.length) html += renderShare();
    html += '<div class="actions"><button class="btn" type="button" id="again">もう一度</button></div></section>';
    return html;
  }

  function render() {
    renderStatus();
    if (state.finished) {
      $main.innerHTML = renderSummary();
    } else {
      $main.innerHTML = renderBattle(state.q) + renderAnswer(state.q) + (state.answered ? renderResult(state.q) : "");
    }
    bind();
  }

  function bind() {
    $main.querySelectorAll("[data-choice]").forEach(function (b) {
      b.addEventListener("click", function () { submitChoice(+b.dataset.choice); });
    });
    var form = document.getElementById("guess-form");
    if (form) form.addEventListener("submit", function (e) { e.preventDefault(); submitNumber(); });
    var nextBtn = document.getElementById("next");
    if (nextBtn) { nextBtn.addEventListener("click", next); nextBtn.focus({ preventScroll: true }); }
    var quit = document.getElementById("quit");
    if (quit) quit.addEventListener("click", finish);
    var again = document.getElementById("again");
    if (again) again.addEventListener("click", function () { setMode(state.mode); });
    var copy = document.getElementById("share-copy");
    if (copy) copy.addEventListener("click", copyShare);
    var nat = document.getElementById("share-native");
    if (nat) nat.addEventListener("click", function () {
      navigator.share({ title: "ダメージ感覚", text: shareText(), url: SITE_URL }).catch(function () { /* キャンセル時は何もしない */ });
    });
  }

  document.querySelectorAll(".modes button").forEach(function (b) {
    b.addEventListener("click", function () { setMode(b.dataset.mode); });
  });
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) return;
    if (!state.finished && !state.answered && state.mode === "easy" && /^[1-4]$/.test(e.key)) submitChoice(+e.key - 1);
  });

  var snap = data.snapshot;
  if (snap) {
    document.getElementById("snapshot").textContent = "シーズン" + snap.snapshot_id.replace("_single", "") + " シングル使用率上位50（" + snap.date + "取得）";
    document.getElementById("source").textContent = snap.source_url;
  }
  newQuestion();
})();
</script>

</html>
